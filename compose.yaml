
services:
  frontend:
    container_name: flight_appn_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2128:80"
    networks:
      - Appn_network
    volumes:
      - FlightAppnVol:/Appn_Status/

  database:
    container_name: mysql_db
    image: mysql:8.4
    ports:
      - "2129:3306"
    networks:
      - Appn_network
    volumes:
      - FlightAppnDBVol:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: flight_booking
      MYSQL_USER: flightuser
      MYSQL_PASSWORD: password123

networks:
  Appn_network:
    driver: overlay

volumes:
  FlightAppnVol:
  FlightAppnDBVol:
