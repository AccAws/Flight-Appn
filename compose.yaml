
services:

  frontend:
    container_name: flight_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "2128:80"
    networks:
      - Appn_network
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    container_name: flight_backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_PASSWORD: password123
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/flight_booking
      SPRING_DATASOURCE_USERNAME: flightuser
    networks:
      - Appn_network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    container_name: mysql_db
    image: mysql:8.4
    ports:
      - "2129:3306"
    networks:
      - Appn_network
    volumes:
      - FlightAppnDBVol:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: flight_booking
      MYSQL_USER: flightuser
      MYSQL_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  Appn_network:
    driver: bridge

volumes:
  FlightAppnDBVol:
