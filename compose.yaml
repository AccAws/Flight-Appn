
services:
  frontend:
    container_name: flight_appn_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2128:8080"
    networks:
      - Appn_network
    environment:
      DB_PASSWORD: password123
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: mysql_db
    image: mysql:8.4
    ports:
      - "2129:3306"
    networks:
      - Appn_network
    volumes:
      - FlightAppnDBVol:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: flight_booking
      MYSQL_USER: flightuser
      MYSQL_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  Appn_network:
    driver: bridge

volumes:
  FlightAppnDBVol:
